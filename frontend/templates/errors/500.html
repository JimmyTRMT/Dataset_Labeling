{% extends "base.html" %}
{% block title %}500 - Server error{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-8 text-center mt-12">
    <p class="text-rose-600 dark:text-rose-400 font-mono text-sm tracking-widest">ERROR 500</p>
    <h1 class="text-2xl font-semibold mt-2">Internal error</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-2">Something went wrong on the server. Please try again in a moment.</p>
    <a href="{{ url_for('home') }}"
       class="inline-block mt-6 px-5 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg font-medium text-white transition-colors">
        Back to Home
    </a>
</div>
{% endblock %}
